# =============================================================================
# FitProof - Coding Convention Configuration
# Лаборатори 6: Code Review ба Coding Convention
# =============================================================================

[flake8]
# Flake8 - Python код стандартын шалгагч тохиргоо
max-line-length = 100
max-complexity = 10
exclude = 
    venv,
    __pycache__,
    *.pyc,
    .git,
    migrations,
    *.egg-info
ignore = E501,W503,E203
per-file-ignores =
    __init__.py:F401

[pylint.messages_control]
disable = missing-module-docstring,too-few-public-methods

[pylint.format]
max-line-length = 100

[pylint.basic]
good-names = i,j,k,ex,_,db,id,xp

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
