{% extends "base.html" %}

{% block title %}Бүртгүүлэх - FitProof{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        max-width: 400px;
        margin: 3rem auto;
    }

    .auth-card {
        background: var(--bg-card);
        border-radius: 24px;
        padding: 2.5rem;
        border: 1px solid var(--border);
    }

    .auth-title {
        text-align: center;
        font-size: 2rem;
        margin-bottom: 0.5rem;
    }

    .auth-subtitle {
        text-align: center;
        color: var(--text-secondary);
        margin-bottom: 2rem;
    }

    .auth-footer {
        text-align: center;
        margin-top: 1.5rem;
        color: var(--text-secondary);
    }

    .auth-footer a {
        color: var(--primary);
        text-decoration: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">Бүртгүүлэх</h1>
        <p class="auth-subtitle">FitProof-т нэгдээрэй!</p>

        <form method="POST" action="{{ url_for('main.register') }}">
            <div class="form-group">
                <label>Хэрэглэгчийн нэр</label>
                <input type="text" name="username" required placeholder="username">
            </div>
            <div class="form-group">
                <label>И-мэйл</label>
                <input type="email" name="email" required placeholder="email@example.com">
            </div>
            <div class="form-group">
                <label>Нууц үг</label>
                <input type="password" name="password" required placeholder="********" minlength="6">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Бүртгүүлэх</button>
        </form>

        <p class="auth-footer">
            Бүртгэлтэй юу? <a href="{{ url_for('main.login') }}">Нэвтрэх</a>
        </p>
    </div>
</div>
{% endblock %}
